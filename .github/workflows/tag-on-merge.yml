name: Tag on Merge

on:
  push:
    branches:
      - QAT 

jobs:
  create-backup-QAT-tag:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Get Current Date and Time
      id: datetime
      run: echo "tag_datetime=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_ENV

    - name: Create Tag
      env:
        TAG_DATE: ${{ env.tag_datetime }}
      run: |
        TAG_NAME="backup-qat-${TAG_DATE}"
        echo "Creating tag: $TAG_NAME"
        git config --global user.name "pankaj-arcitech"
        git config --global user.email "pankaj@arcitech.ai"
        git tag -a $TAG_NAME -m "QAT Backup tag created on ${TAG_DATE}"
        git push origin $TAG_NAME
